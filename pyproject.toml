# Tooling config for the repository-level Codex reviewer.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mvp_reviewer"]

[tool.ruff.format]
quote-style = "double"
